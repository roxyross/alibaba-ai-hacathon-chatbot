[project]
name = "roxy-ai-gateway"
version = "0.1.0"
description = "ROXY JARVIS multi-provider AI gateway service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ROXY JARVIS Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pydantic[email]>=2.9.0",
    "httpx>=0.27.0",
    "pybreaker>=1.0.2",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    # T027 SQLAlchemy
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # Auth (magic-link + JWT)
    "pyjwt>=2.9.0",
    "aiosmtplib>=3.0.1",
    "icalendar>=5.0.0",
    "slowapi>=0.1.9",
    # Scheduler for scheduled job firing
    "apscheduler>=3.10.4",
    # Document parsing (lightweight)
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
media = [
    "playwright>=1.40.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "moviepy>=2.0.0",
    "ffmpeg-python>=0.2.0",
    "unstructured>=0.15.0",
    "llama-parse>=0.1.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
