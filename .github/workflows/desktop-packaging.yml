name: Roxy AI Desktop Distribution

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-desktop:
    name: Build Desktop Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: roxy-windows-installer
            target_flag: --win
          - os: macos-14
            artifact_name: roxy-macos-dmg
            target_flag: --mac
          - os: ubuntu-latest
            artifact_name: roxy-linux-appimage
            target_flag: --linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Web Application Bundle
        run: |
          cd frontend
          npm run build

      - name: Install Desktop Dependencies & Compile TypeScript
        run: |
          cd desktop
          npm install electron@^33.2.1 electron-builder@^25.1.8 electron-updater@^6.3.9 typescript@^5.5.4 --no-save
          npx tsc -p tsconfig.json

      - name: Validate Desktop Application Icons
        run: |
          cd desktop
          python scripts/validate_icons.py

      - name: Package Desktop Binary
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.WIN_CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.WIN_CSC_KEY_PASSWORD }}"
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_APP_SPECIFIC_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          fi
          npx electron-builder ${{ matrix.target_flag }} --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/release/*.*
          if-no-files-found: warn
