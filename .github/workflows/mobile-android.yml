name: Roxy AI Android Distribution

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    name: Build Android Client (APK & Play Store AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Web Application Bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r frontend/dist/* android/app/src/main/assets/public/

      - name: Decode Keystore (if CI secret configured)
        if: env.ROXY_KEYSTORE_BASE64 != ''
        env:
          ROXY_KEYSTORE_BASE64: ${{ secrets.ROXY_KEYSTORE_BASE64 }}
        run: |
          echo "$ROXY_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          echo "ROXY_KEYSTORE_PATH=release.jks" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew || true

      - name: Build Android Release APK & AAB Bundle
        env:
          ROXY_KEYSTORE_PASSWORD: ${{ secrets.ROXY_KEYSTORE_PASSWORD }}
          ROXY_KEY_ALIAS: ${{ secrets.ROXY_KEY_ALIAS }}
          ROXY_KEY_PASSWORD: ${{ secrets.ROXY_KEY_PASSWORD }}
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace
          else
            gradle assembleRelease bundleRelease --stacktrace || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roxy-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roxy-android-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
